<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-src https:"
    />
    <meta name="color-scheme" content="dark" />
    <title>Igrobar Launcher</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>

    <div class="shell">
      <aside class="sidebar">
        <img class="sidebar__logo" src="../../assets/ui/logo.png" alt="Igrobar Launcher" />
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
        <div class="sidebar__footer" id="sidebar-footer"></div>
      </aside>

      <header class="topbar">
        <div class="brand">Igrobar<b>Launcher</b></div>
        <span class="version-pill" id="app-version" hidden></span>
        <span class="topbar__title" id="topbar-title"></span>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <button class="btn btn--ghost btn--sm" id="logs-btn" type="button">Журнал игры</button>
          <button class="account-chip" id="account-chip" type="button" aria-label="Аккаунты">
            <span class="account-chip__avatar" id="account-avatar"></span>
            <span id="account-name">Войти</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 9.5 6.5 6.5 6.5-6.5" /></svg>
          </button>
          <div class="window-controls">
            <button class="win-btn" id="win-min" type="button" aria-label="Свернуть">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
            </button>
            <button class="win-btn" id="win-max" type="button" aria-label="Развернуть"></button>
            <button class="win-btn win-btn--close" id="win-close" type="button" aria-label="Закрыть">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="page-host" id="page-host"></main>
    </div>

    <div id="modal-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script src="../shared/i18n.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/util.js"></script>
    <script src="js/skin3d.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/builds.js"></script>
    <script src="js/pages/content.js"></script>
    <script src="js/pages/skin.js"></script>
    <script src="js/pages/map.js"></script>
    <script src="js/pages/settings.js"></script>
  </body>
</html>
