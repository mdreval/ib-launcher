name: Discord Release Notification

on:
  release:
    types: [published, released, created]
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Передаем токен GitHub для доступа к API (чтобы не упереться в лимиты)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              print("ERROR: DISCORD_WEBHOOK secret is missing!")
              exit(1)

          repository = os.environ.get('REPOSITORY')
          server_url = os.environ.get('SERVER_URL', 'https://github.com')
          gh_token = os.environ.get('GH_TOKEN')

          # Считываем переменные из события релиза (если оно сработало автоматически)
          release_tag = os.environ.get("RELEASE_TAG")
          release_name = os.environ.get("RELEASE_NAME")
          release_url = os.environ.get("RELEASE_URL")
          release_body = os.environ.get("RELEASE_BODY")

          # ЕСЛИ ЭТО РУЧНОЙ ЗАПУСК (нет тега релиза), подтягиваем данные через GitHub API о последнем релизе
          if not release_tag or release_tag == "":
              print("Manual trigger detected: fetching the latest release from GitHub API...")
              api_url = f"https://api.github.com/repos/{repository}/releases/latest"
              
              req = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "GitHub-Actions-Script"
                  }
              )
              
              try:
                  with urllib.request.urlopen(req) as resp:
                      latest_data = json.loads(resp.read().decode("utf-8"))
                      release_tag = latest_data.get("tag_name", "No Tag")
                      release_name = latest_data.get("name") or release_tag
                      release_url = latest_data.get("html_url", f"{server_url}/{repository}")
                      release_body = latest_data.get("body") or "No release notes provided."
              except Exception as e:
                  print(f"Warning: Could not fetch latest release via API: {e}")
                  release_tag = "Manual/No Tag"
                  release_name = release_tag
                  release_url = f"{server_url}/{repository}"
                  release_body = "A new release is now available (triggered manually)."

          # Защита от пустых значений на всякий случай
          release_tag = release_tag or "No Tag"
          release_name = release_name or release_tag
          release_url = release_url or f"{server_url}/{repository}"
          release_body = release_body or "No release notes provided."

          if len(release_body) > 4000:
              release_body = release_body[:3997] + "..."

          repository_url = f"{server_url}/{repository}"

          payload = {
              "username": "GitHub Releases",
              "embeds": [
                  {
                      "title": f"🚀 {release_name}",
                      "description": release_body,
                      "url": release_url,
                      "color": 5814783,
                      "fields": [
                          {
                              "name": "Version",
                              "value": f"`{release_tag}`",
                              "inline": True
                          },
                          {
                              "name": "Repository",
                              "value": f"[GitHub]({repository_url})",
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "GitHub Release"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord response: {response.status}")
          except Exception as e:
              print(f"Failed to send Discord webhook: {e}")
              exit(1)
          PY