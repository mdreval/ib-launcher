name: Discord Release Notification

on:
  release:
    types: [published, released, created]
  workflow_dispatch: # <--- Твоя кнопка ручного запуска на месте[cite: 1]

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          # Безопасно проверяем секрет вебхука
          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              print("ERROR: DISCORD_WEBHOOK secret is missing!")
              exit(1)

          # Безопасно считываем параметры релиза (чтобы не было KeyError при ручном запуске)
          release_tag = os.environ.get("RELEASE_TAG") or "Manual/No Tag"
          release_name = os.environ.get("RELEASE_NAME") or release_tag
          release_url = os.environ.get("RELEASE_URL") or "https://github.com"
          release_body = os.environ.get("RELEASE_BODY") or "A new release is now available (or triggered manually)."

          if len(release_body) > 4000:
              release_body = release_body[:3997] + "..."

          server_url = os.environ.get('SERVER_URL', 'https://github.com')
          repository = os.environ.get('REPOSITORY', 'unknown/repo')
          repository_url = f"{server_url}/{repository}"

          payload = {
              "username": "GitHub Releases",
              "embeds": [
                  {
                      "title": f"🚀 {release_name}",
                      "description": release_body,
                      "url": release_url,
                      "color": 5814783,
                      "fields": [
                          {
                              "name": "Version",
                              "value": f"`{release_tag}`",
                              "inline": True
                          },
                          {
                              "name": "Repository",
                              "value": f"[GitHub]({repository_url})",
                              "inline": True
                          }
                      ],
                      "footer": {
                        "text": "GitHub Release"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord response: {response.status}")
          except Exception as e:
              print(f"Failed to send Discord webhook: {e}")
              exit(1)
          PY