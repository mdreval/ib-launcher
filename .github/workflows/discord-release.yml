name: Discord Release Notification

on:
  release:
    types: [published, released, created]
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import re

          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              print("ERROR: DISCORD_WEBHOOK is missing!")
              exit(1)

          repository = os.environ.get('REPOSITORY')
          server_url = os.environ.get('SERVER_URL', 'https://github.com')
          gh_token = os.environ.get('GH_TOKEN')

          release_tag = os.environ.get("RELEASE_TAG")
          release_name = os.environ.get("RELEASE_NAME")
          release_url = os.environ.get("RELEASE_URL")
          release_body = os.environ.get("RELEASE_BODY")

          # Если запуск ручной, подтягиваем последний релиз через API
          if not release_tag or release_tag == "":
              print("Manual trigger detected: fetching the latest release from GitHub API...")
              api_url = f"https://api.github.com/repos/{repository}/releases/latest"
              
              req = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "GitHub-Actions-Script"
                  }
              )
              
              try:
                  with urllib.request.urlopen(req) as resp:
                      latest_data = json.loads(resp.read().decode("utf-8"))
                      release_tag = latest_data.get("tag_name", "No Tag")
                      release_name = latest_data.get("name") or release_tag
                      release_url = latest_data.get("html_url", f"{server_url}/{repository}")
                      release_body = latest_data.get("body") or "No release notes provided."
              except Exception as e:
                  print(f"Warning: Could not fetch latest release via API: {e}")
                  release_tag = "Manual/No Tag"
                  release_name = release_tag
                  release_url = f"{server_url}/{repository}"
                  release_body = "A new release is now available (triggered manually)."

          release_tag = release_tag or "No Tag"
          release_name = release_name or release_tag
          release_url = release_url or f"{server_url}/{repository}"
          release_body = release_body or "No release notes provided."

          # Ищем картинку в формате Markdown внутри релиз-ноута и вырезаем её из текста
          image_url = None
          img_match = re.search(r'!\[([^\]]*)\]\((https?://[^\)]+)\)', release_body)
          if img_match:
              image_url = img_match.group(2)
              release_body = release_body.replace(img_match.group(0), "").strip()

          if len(release_body) > 4000:
              release_body = release_body[:3997] + "..."

          repository_url = f"{server_url}/{repository}"

          # Формируем структуру эмбеда
          embed = {
              "title": f"🚀 {release_name}",
              "description": release_body,
              "url": release_url,
              "color": 5814783,
              "fields": [
                  {
                      "name": "Version",
                      "value": f"`{release_tag}`",
                      "inline": True
                  },
                  {
                      "name": "Repository",
                      "value": f"[GitHub]({repository_url})",
                      "inline": True
                  }
              ],
              "footer": {
                  "text": "GitHub Release"
              }
          }

          # Если в релизе нашлась картинка, добавляем её в отдельный крупный блок превью
          if image_url:
              embed["image"] = {"url": image_url}

          # Добавляем content с @everyone в самое начало сообщения
          payload = {
              "content": "@everyone",
              "username": "GitHub Releases",
              "embeds": [embed],
              "allowed_mentions": {
                  "parse": ["everyone"]
              }
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord response: {response.status}")
          except Exception as e:
              print(f"Failed to send Discord webhook: {e}")
              exit(1)
          PY