name: Build & Release

# Версия лаунчера задаётся в data/server_profiles.json → "launcher_version".
#
# Как выпустить новую версию лаунчера:
#   1. поменяйте "launcher_version" в data/server_profiles.json (например 2.0.1)
#      и опишите изменения в RELEASE_NOTES.md;
#   2. git commit и git push в ветку main.
#
# Что делает workflow:
#   check     — если опубликованного релиза vX.Y.Z ещё нет, создаёт его
#               черновиком (draft) с текстом из RELEASE_NOTES.md;
#   build     — две сборки: Windows (.exe) и macOS Apple Silicon (.dmg).
#               Mac на Intel больше не собирается — лаунчер на таком Mac
#               сообщает об этом и даёт ссылку на страницу релиза;
#   finalize  — когда все файлы загружены, публикует релиз (до этого игроки
#               его не видят и обновление не начнётся «наполовину») и сразу
#               отправляет уведомление в Discord (секрет DISCORD_WEBHOOK).
#
# Если версия не менялась — сборка пропускается, релиз не создаётся.
# Ручной запуск (Run workflow) только собирает файлы без публикации —
# их можно скачать во вкладке Actions → Artifacts.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from data/server_profiles.json
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./data/server_profiles.json').launcher_version")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=never" >> "$GITHUB_OUTPUT"
            echo "Ручной запуск: сборка без публикации ($VERSION)"
            exit 0
          fi
          DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$DRAFT" = "false" ]; then
            echo "publish=skip" >> "$GITHUB_OUTPUT"
            echo "Релиз $TAG уже опубликован — сборка не нужна"
            exit 0
          fi
          if [ "$DRAFT" = "missing" ]; then
            gh release create "$TAG" --repo "${{ github.repository }}" --draft \
              --target "${{ github.sha }}" --title "Igrobar Launcher $VERSION" --notes-file RELEASE_NOTES.md
            echo "Создан черновик релиза $TAG"
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "Igrobar Launcher $VERSION" --notes-file RELEASE_NOTES.md
            echo "Черновик $TAG уже есть (прошлая сборка не закончилась) — собираю заново"
          fi
          echo "publish=always" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win nsis --x64
          - name: mac-arm64
            os: macos-latest
            args: --mac dmg --arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync version into package.json
        run: node scripts/sync-version.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish ${{ needs.check.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: igrobar-launcher-${{ matrix.name }}
          path: |
            dist-installer/*.exe
            dist-installer/*.dmg
            dist-installer/*.yml
          if-no-files-found: ignore

  finalize:
    needs: [check, build]
    if: needs.check.outputs.publish == 'always' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --title "Igrobar Launcher ${{ needs.check.outputs.version }}" \
            --notes-file RELEASE_NOTES.md --draft=false --latest

      # Уведомление в Discord — прямо здесь, автоматически после публикации.
      # (Отдельный discord-release.yml на такие релизы сам не срабатывает:
      # GitHub не запускает workflow из-за действий других workflow.)
      # Нужен секрет DISCORD_WEBHOOK: Settings → Secrets and variables → Actions.
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              print("Секрета DISCORD_WEBHOOK нет — уведомление пропущено")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          version = os.environ["VERSION"]
          tag = f"v{version}"
          release = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "url,assets"]))
          release_url = release["url"]
          exe = next((a for a in release["assets"] if a["name"].endswith(".exe")), None)

          body = open("RELEASE_NOTES.md", encoding="utf-8").read()
          image_url = None
          m = re.search(r'!\[[^\]]*\]\((https?://[^)]+)\)', body)
          if m:
              image_url = m.group(1)
              body = body.replace(m.group(0), "").strip()
          # Заголовки Markdown Discord показывает плохо — делаем их жирными.
          body = re.sub(r'^#{1,6}\s*(.+)$', r'**\1**', body, flags=re.M)
          if len(body) > 3900:
              body = body[:3897] + "..."

          fields = [{"name": "Версия", "value": f"`{tag}`", "inline": True}]
          if exe:
              fields.append({"name": "Скачать", "value": f"[Windows (.exe)]({exe['url']})", "inline": True})
          fields.append({"name": "Все файлы", "value": f"[GitHub]({release_url})", "inline": True})

          embed = {
              "title": f"🚀 Igrobar Launcher {version}",
              "description": body,
              "url": release_url,
              "color": 0xE2262C,
              "fields": fields,
              "footer": {"text": "GitHub Release"},
          }
          if image_url:
              embed["image"] = {"url": image_url}

          payload = {
              "content": "@everyone",
              "username": "Igrobar Launcher",
              "embeds": [embed],
              "allowed_mentions": {"parse": ["everyone"]},
          }
          req = urllib.request.Request(
              webhook, data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions"}, method="POST")
          with urllib.request.urlopen(req) as resp:
              print(f"Discord: {resp.status}")
          PY
